name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      # The environment tests share HOME and PATH; one thread is deterministic.
      - run: cargo test --locked -- --test-threads=1
      - name: Native X11 smoke test
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb xauth xdotool x11-apps x11-utils imagemagick
          xvfb-run -a cargo test --locked focus_waits_for_window_manager_mapping -- --ignored --test-threads=1
          cargo build --release --locked
          sh tests/ui-smoke.sh target/release/nirulauncher
          sh tests/theme-colors.sh target/release/nirulauncher
      - name: Shellcheck
        run: |
          docker run --rm -v "$PWD":/src:ro koalaman/shellcheck:stable \
            -S warning -s sh /src/install.sh /src/tests/ui-smoke.sh
