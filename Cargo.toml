[package]
name = "nirulauncher"
version = "0.22.1"
edition = "2021"
rust-version = "1.75"
license = "MIT"
description = "Native NIRU application and desktop-action launcher"

[dependencies]
x11rb = { version = "0.13", features = ["randr", "xtest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ab_glyph = "0.2"
# Keep the lockfile compatible with the declared Rust 1.75 baseline.
indexmap = "=2.7.1"
libc = "0.2"
zbus = "4.4"
ttf-parser = { version = "0.25", default-features = false, features = ["std", "opentype-layout"] }
png = "0.17"
# SVG application icons in the panel, rendered once and cached as PNG. No
# text support: icons do not need fonts.
resvg = { version = "0.45", default-features = false }
niruicons = { git = "https://github.com/nirucon/niruicons", tag = "v0.1.1" }

[profile.release]
lto = true
codegen-units = 1
strip = true
